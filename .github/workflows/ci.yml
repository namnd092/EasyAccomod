name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5100

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easyaccomod
          POSTGRES_PASSWORD: easyaccomod
          POSTGRES_DB: easyaccomod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyaccomod"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5100
      Jwt__Key: ci-only-signing-key-0123456789abcdef0123
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=easyaccomod;Username=easyaccomod;Password=easyaccomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build server-app/EasyAccomod.slnx -c Release
      - name: API tests
        # Each run creates and drops its own database on the postgres service.
        run: dotnet test server-app/EasyAccomod.slnx -c Release --no-build
      - name: Start the API
        # Run from the output folder so the app finds its appsettings and data files.
        working-directory: server-app/EasyAccomod.Api/bin/Release/net10.0
        run: |
          dotnet EasyAccomod.Api.dll > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5100/api/Provinces && exit 0
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/api.log"
          exit 1
      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:5100
      - name: API log
        if: failure()
        run: cat api.log

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easyaccomod
          POSTGRES_PASSWORD: easyaccomod
          POSTGRES_DB: easyaccomod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyaccomod"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5100
      Jwt__Key: ci-only-signing-key-0123456789abcdef0123
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=easyaccomod;Username=easyaccomod;Password=easyaccomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-app/package-lock.json
      - run: dotnet build server-app/EasyAccomod.slnx -c Release
      - name: Start the API
        working-directory: server-app/EasyAccomod.Api/bin/Release/net10.0
        run: |
          dotnet EasyAccomod.Api.dll > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5100/api/Provinces && exit 0
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/api.log"
          exit 1
      - name: Install client dependencies
        working-directory: client-app
        run: npm ci
      - name: Build the client
        working-directory: client-app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5100
      - name: Install Chromium
        working-directory: client-app
        run: npx playwright install --with-deps chromium
      - name: Run the e2e tests
        working-directory: client-app
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client-app/playwright-report
            client-app/test-results
      - name: API log
        if: failure()
        run: cat api.log
