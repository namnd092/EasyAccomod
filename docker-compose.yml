services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: easyaccomod
      POSTGRES_PASSWORD: easyaccomod
      POSTGRES_DB: easyaccomod
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyaccomod"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the API in a container (`docker compose --profile api up -d --build`).
  # Requires JWT_KEY (at least 32 characters). Set ASPNETCORE_ENVIRONMENT=Development
  # to seed the demo accounts.
  api:
    profiles: ["api"]
    build: ./server-app/EasyAccomod.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=easyaccomod;Username=easyaccomod;Password=easyaccomod
      Jwt__Key: ${JWT_KEY:-}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:3000}
      # Refresh cookie: Secure by default outside Development; set REFRESH_COOKIE_SECURE=false for plain http.
      Auth__RefreshCookieSameSite: ${REFRESH_COOKIE_SAMESITE:-Strict}
      Auth__RefreshCookieSecure: ${REFRESH_COOKIE_SECURE:-}
    ports:
      - "5100:8080"

volumes:
  pgdata:
