services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: easyaccomod
      POSTGRES_PASSWORD: easyaccomod
      POSTGRES_DB: easyaccomod
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyaccomod"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
